services:
  - type: web
    name: timeclock-service
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    preDeployCommand: npm run db:migrate && npm run db:seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: timeclock-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Steward Owner
      - key: COMPANY_NAME
        value: My Company
      - key: KIOSK_ALLOWED_ORIGINS
        value: capacitor://localhost,https://localhost
      - key: NEXT_PUBLIC_APP_NAME
        value: TimeClock

databases:
  - name: timeclock-postgres
    databaseName: timeclock
    user: timeclock
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    diskSizeGB: 15
    ipAllowList: []
